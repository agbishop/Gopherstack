name: Pull Request CI

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
  workflow_run:
    workflows: ["Copilot coding agent"]
    types: [completed]
    branches-ignore:
      - main

permissions: read-all

# Only the latest commit per PR (or ref) needs CI. A new push cancels any
# still-running CI for the same PR so rapid commit bursts don't pile up runs;
# CI settles on the last commit, which is all that matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

env:
  GH_CI_TOKEN: ${{ secrets.GH_TOKEN != '' && secrets.GH_TOKEN || github.token }}

jobs:
  ui-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ env.GH_CI_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: npm --prefix ui ci

      - name: Run UI lint
        run: npm --prefix ui run lint

      - name: Run UI format check
        run: npm --prefix ui run fmt:check

      - name: Run UI type check
        run: npm --prefix ui run check
        env:
          NODE_OPTIONS: --max-old-space-size=8192

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ env.GH_CI_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Read golangci-lint version
        id: golangci-lint-version
        run: echo "version=$(grep '^GOLANGCI_LINT_VERSION=' Makefile | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v${{ steps.golangci-lint-version.outputs.version }}

  # Fails fast on tag-gated compile breaks (e2e, integration) before the slow
  # e2e/integration/terraform jobs run any tests -- see gopherstack-0bpp.
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ env.GH_CI_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Verify build with all tag combinations
        run: make build-check

  modernize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ env.GH_CI_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: go fix (modernize)
        run: go fix -diff ./...

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ env.GH_CI_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Check sdk_module pins
        run: make check-pins

      - name: Generate docs
        run: make docs

      - name: Fail if docs are out of date
        run: git diff --exit-code

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ env.GH_CI_TOKEN }}
          persist-credentials: false

      - name: govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1
        with:
          go-version-file: go.mod
          go-package: ./...
          output-format: sarif
          output-file: govulncheck.sarif

      - name: Upload govulncheck SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: govulncheck.sarif
          category: govulncheck

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [ 'go' ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ env.GH_CI_TOKEN }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: 'autobuild'
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: "/language:${{ matrix.language }}"

  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chunk: [0, 1, 2, 3]
    steps:
      # Full history: cmd/errcodeaudit's tests materialize services/ecs at an
      # old revision with `git archive`, which a shallow clone cannot resolve.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ env.GH_CI_TOKEN }}
          fetch-depth: 0

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Compute package shard for chunk
        id: pkgs
        run: |
          TOTAL_CHUNKS=4
          CHUNK=${{ matrix.chunk }}
          # -coverpkg stays the full, unfiltered package set on every chunk so
          # cross-package coverage instrumentation (and the thresholds in
          # .testcoverage.yml, which are calibrated against it) is unchanged
          # by sharding. Only the set of packages each chunk *tests* is split.
          COVERPKGS=$(go list ./... | grep -v -E '(test/|/demo$|/modules/|/teststack$)' | tr '\n' ',' | sed 's/,$//')
          # Round-robin distribute all packages (the same set `./...` would
          # expand to) across chunks, so every package is tested by exactly
          # one chunk.
          ALL_PKGS=$(go list ./...)
          CHUNK_PKGS=$(echo "$ALL_PKGS" | awk "NR % ${TOTAL_CHUNKS} == ${CHUNK}")
          COUNT=$(echo "$CHUNK_PKGS" | grep -c .)
          PKG_ARGS=$(echo "$CHUNK_PKGS" | tr '\n' ' ')
          {
            echo "coverpkgs=$COVERPKGS"
            echo "pkgs=$PKG_ARGS"
          } >> "$GITHUB_OUTPUT"
          echo "Running $COUNT packages in chunk $CHUNK of $TOTAL_CHUNKS"

      - name: Run Unit Tests (chunk ${{ matrix.chunk }})
        run: |
          go tool gotestsum --format pkgname -- \
            -race -shuffle on -short -timeout 5m \
            -coverpkg="${{ steps.pkgs.outputs.coverpkgs }}" -coverprofile=unit-${{ matrix.chunk }}-coverage.out -covermode=atomic \
            ${{ steps.pkgs.outputs.pkgs }}

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unit-${{ matrix.chunk }}-coverage
          path: unit-${{ matrix.chunk }}-coverage.out
          retention-days: 1

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: unit-${{ matrix.chunk }}-coverage.out
          fail_ci_if_error: false

  unit:
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - run: echo "All unit tests passed"

  build:
    runs-on: ubuntu-latest
    needs: [build-check]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ env.GH_CI_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Build static binary
        run: |
          mkdir -p dashboard/static/spa
          touch dashboard/static/spa/.keep
          CGO_ENABLED=0 GOOS=linux go build -tags 'netgo osusergo static_build' -trimpath \
            -ldflags="-w -s" -o bin/gopherstack-linux .

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gopherstack-binary
          path: bin/gopherstack-linux
          retention-days: 1

  integration-tests:
    runs-on: ubuntu-latest
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        chunk: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ env.GH_CI_TOKEN }}

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Download binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: gopherstack-binary
          path: bin/

      - name: Make binary executable
        run: chmod +x bin/gopherstack-linux

      - name: Compute test pattern for chunk
        id: tests
        run: |
          TOTAL_CHUNKS=4
          CHUNK=${{ matrix.chunk }}
          # Discover all test functions from source (no Docker needed)
          TESTS=$(grep -rh '^func Test' test/integration/ | sed 's/func \(Test[^ (]*\).*/\1/' | grep -v '^TestMain$' | sort)
          # Round-robin distribute tests across chunks
          CHUNK_TESTS=$(echo "$TESTS" | awk "NR % ${TOTAL_CHUNKS} == ${CHUNK}")
          COUNT=$(echo "$CHUNK_TESTS" | wc -l | tr -d ' ')
          PATTERN=$(echo "$CHUNK_TESTS" | tr '\n' '|' | sed 's/|$//')
          echo "pattern=^(${PATTERN})$" >> "$GITHUB_OUTPUT"
          echo "Running $COUNT tests in chunk $CHUNK of $TOTAL_CHUNKS"

      - name: Run Integration Tests (chunk ${{ matrix.chunk }})
        run: |
          echo "bin/gopherstack-linux exists: $(test -f bin/gopherstack-linux && echo yes || echo no)"
          go tool gotestsum --format standard-verbose -- \
            -race -shuffle on -timeout 10m -v \
            -run '${{ steps.tests.outputs.pattern }}' \
            -coverpkg=./... -coverprofile=integration-${{ matrix.chunk }}-coverage.out -covermode=atomic \
            ./test/integration/...

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: integration-${{ matrix.chunk }}-coverage
          path: integration-${{ matrix.chunk }}-coverage.out
          retention-days: 1

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: integration-${{ matrix.chunk }}-coverage.out
          fail_ci_if_error: false

  integration:
    runs-on: ubuntu-latest
    needs: [integration-tests]
    steps:
      - run: echo "All integration tests passed"

  terraform-tests:
    runs-on: ubuntu-latest
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        chunk: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ env.GH_CI_TOKEN }}

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Download binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: gopherstack-binary
          path: bin/

      - name: Make binary executable
        run: chmod +x bin/gopherstack-linux

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          tofu_wrapper: false
          tofu_version: "1.11.6"

      - name: Cache OpenTofu providers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /tmp/gopherstack-tofu-provider-cache
          key: tofu-providers-${{ runner.os }}-aws5

      - name: Compute test pattern for chunk
        id: tests
        run: |
          TOTAL_CHUNKS=8
          CHUNK=${{ matrix.chunk }}
          # Discover all test functions from source (no Docker needed)
          TESTS=$(grep -rh '^func Test' test/terraform/*_test.go | sed 's/func \(Test[^ (]*\).*/\1/' | sort -u)
          # Round-robin distribute tests across chunks
          CHUNK_TESTS=$(echo "$TESTS" | awk "NR % ${TOTAL_CHUNKS} == ${CHUNK}")
          COUNT=$(echo "$CHUNK_TESTS" | wc -l | tr -d ' ')
          PATTERN=$(echo "$CHUNK_TESTS" | tr '\n' '|' | sed 's/|$//')
          echo "pattern=^(${PATTERN})$" >> "$GITHUB_OUTPUT"
          echo "Running $COUNT tests in chunk $CHUNK of $TOTAL_CHUNKS"

      - name: Run OpenTofu Tests (chunk ${{ matrix.chunk }})
        run: |
          echo "tofu version: $(tofu version)"
          echo "bin/gopherstack-linux exists: $(test -f bin/gopherstack-linux && echo yes || echo no)"
          go tool gotestsum --format standard-verbose -- \
            -race -parallel 8 -timeout 15m \
            -run '${{ steps.tests.outputs.pattern }}' \
            -v ./test/terraform/...

  terraform:
    runs-on: ubuntu-latest
    needs: [terraform-tests]
    steps:
      - run: echo "All terraform tests passed"

  e2e-tests:
    runs-on: ubuntu-latest
    needs: [build-check]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ env.GH_CI_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            ui/package-lock.json
            test/e2e/crosssdk/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Build UI
        working-directory: ui
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          npm ci
          npm run build

      - name: Install Playwright Browsers
        run: |
          go run github.com/mxschmitt/playwright-go/cmd/playwright@v0.6100.0 install --with-deps chromium

      - name: Install Azure cross-SDK smoke test dependencies
        working-directory: test/e2e/crosssdk
        run: |
          npm ci
          pip install -r requirements.txt

      - name: Run E2E Tests
        run: |
          COVERPKGS=$(go list ./... | grep -v -E '(test/|/demo$|/modules/|/teststack$)' | tr '\n' ',' | sed 's/,$//')
          go tool gotestsum --format pkgname -- \
            -race -shuffle on -timeout 20m -tags=e2e \
            -coverpkg="$COVERPKGS" -coverprofile=e2e-coverage.out -covermode=atomic \
            ./test/e2e/...

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-coverage
          path: e2e-coverage.out
          retention-days: 1

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: e2e-coverage.out
          fail_ci_if_error: false

  e2e:
    runs-on: ubuntu-latest
    needs: [e2e-tests]
    steps:
      - run: echo "All e2e tests passed"

  ui-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ env.GH_CI_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Run UI Tests
        working-directory: ui
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: npx vitest run

  coverage:
    runs-on: ubuntu-latest
    needs: [unit, integration, e2e]
    permissions:
      contents: write
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ env.GH_CI_TOKEN }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Download All Coverage Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: '*-coverage'
          merge-multiple: true

      - name: Merge Coverage Profiles
        run: |
          # Every test job runs with a wide -coverpkg (all instrumented
          # packages), so each downloaded profile already contains a block
          # for every package under test -- including ones that job never
          # exercised. A naive `tail -n +2 ... >> coverage.out` concatenation
          # therefore duplicates every block once per job (~6x here), which
          # can blow past downstream tooling's string size limits. covmerge
          # dedupes on block key and sums counts instead, the same merge
          # semantics as gocovmerge. See cmd/covmerge for details.
          shopt -s nullglob
          files=(*-coverage.out)
          shopt -u nullglob
          if [ ${#files[@]} -eq 0 ]; then
            echo "No coverage profiles found to merge" >&2
            exit 1
          fi
          echo "Merging ${#files[@]} coverage profiles: ${files[*]}"
          go run ./cmd/covmerge -o coverage.out "${files[@]}"
          go tool cover -func=coverage.out | tail -1

      - name: Check Coverage Thresholds
        id: coverage
        uses: vladopajic/go-test-coverage@f94bcf0d6b9fa5fb8b783830b22648f6c17475e2 # v2
        with:
          profile: coverage.out
          config: .testcoverage.yml

      # Uploads the merged unit+integration+e2e profile, so the Codecov badge
      # matches the coverage reported in the PR comment above. Fork PRs cannot
      # read secrets, but Codecov supports tokenless uploads for fork PRs to
      # public repos, so those still report. Non-fatal, so a Codecov outage
      # never fails CI.
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out
          fail_ci_if_error: false

      - name: Generate Smart Coverage Report
        if: always() && (github.event_name == 'pull_request' || github.event_name == 'workflow_run')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ env.GH_CI_TOKEN }}
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');

            let totalCoverage = '0.0%';
            let newCodeCoverage = 'N/A';
            let newCodeStats = { covered: 0, total: 0 };
            let fileBreakdown = [];

            // Resolve PR number and base ref for both pull_request and workflow_run events
            const prNumber = context.issue?.number
              || context.payload?.workflow_run?.pull_requests?.[0]?.number;
            const baseRef = context.payload?.pull_request?.base?.ref
              || context.payload?.workflow_run?.pull_requests?.[0]?.base?.ref;

            if (!prNumber || !baseRef) {
              console.log('No PR context found, skipping coverage comment');
              return;
            }

            try {
              // 1. Total Coverage
              const totalOutput = execSync('go tool cover -func=coverage.out | grep total | awk \'{print $3}\'').toString().trim();
              totalCoverage = totalOutput;

              // 2. New Code Coverage (Diff-based)
              console.log(`Comparing against base ref: ${baseRef}`);

              // Ensure base ref is fetched
              execSync(`git fetch origin ${baseRef} --depth=1`);

              const diff = execSync(`git diff origin/${baseRef}...HEAD -U0`).toString();
              const changedLines = {}; // file -> Set of line numbers

              const diffLines = diff.split('\n');
              let currentFile = null;
              for (const line of diffLines) {
                if (line.startsWith('+++ b/')) {
                  currentFile = line.substring(6);
                  changedLines[currentFile] = new Set();
                } else if (line.startsWith('@@ ') && currentFile) {
                  const match = line.match(/@@ -\d+(?:,\d+)? \+(\d+)(?:,(\d+))? @@/);
                  if (match) {
                    const start = parseInt(match[1]);
                    const count = parseInt(match[2] || '1');
                    for (let i = 0; i < count; i++) {
                      changedLines[currentFile].add(start + i);
                    }
                  }
                }
              }

              // 3. Parse coverage.out and calculate stats. Read line-by-line
              // via readline instead of fs.readFileSync(...): coverage.out
              // is a merged, deduplicated profile but can still legitimately
              // exceed Node's ~512MB max string length on a large enough
              // codebase, and readFileSync would throw ERR_STRING_TOO_LONG
              // trying to materialize it as one string.
              const readline = require('readline');
              const fileStats = {}; // file -> {covered: 0, total: 0}

              const coverageRl = readline.createInterface({
                input: fs.createReadStream('coverage.out', { encoding: 'utf8' }),
                crlfDelay: Infinity,
              });

              for await (const line of coverageRl) {
                if (!line || line.startsWith('mode:')) continue;

                const [loc, numStmt, hits] = line.split(' ');
                const [fullPath, range] = loc.split(':');
                const [start, end] = range.split(',');
                const startLine = parseInt(start.split('.')[0]);
                const endLine = parseInt(end.split('.')[0]);
                const stmts = parseInt(numStmt);
                const hitCount = parseInt(hits);

                // Find relative path
                const relativePath = fullPath.replace(/^github\.com\/[^\/]+\/[^\/]+\//, '');

                if (changedLines[relativePath]) {
                  if (!fileStats[relativePath]) fileStats[relativePath] = { covered: 0, total: 0 };

                  const fileLines = changedLines[relativePath];
                  let blockImpacted = false;
                  for (let l = startLine; l <= endLine; l++) {
                    if (fileLines.has(l)) {
                      blockImpacted = true;
                      break;
                    }
                  }

                  if (blockImpacted) {
                    newCodeStats.total += stmts;
                    fileStats[relativePath].total += stmts;
                    if (hitCount > 0) {
                      newCodeStats.covered += stmts;
                      fileStats[relativePath].covered += stmts;
                    }
                  }
                }
              }

              if (newCodeStats.total > 0) {
                newCodeCoverage = ((newCodeStats.covered / newCodeStats.total) * 100).toFixed(1) + '%';
              }

              fileBreakdown = Object.entries(fileStats)
                .map(([file, stats]) => ({
                  file,
                  coverage: stats.total > 0 ? ((stats.covered / stats.total) * 100).toFixed(1) + '%' : '0.0%',
                  lines: `${stats.covered}/${stats.total}`
                }))
                .sort((a, b) => a.file.localeCompare(b.file));

            } catch (e) {
              console.log('Failed to calculate coverage metrics:', e);
            }

            const header = '## 📊 Code Coverage Report';
            const totalStatus = parseFloat(totalCoverage) >= 85 ? '✅' : '❌';
            const newStatus = parseFloat(newCodeCoverage) >= 85 || newCodeCoverage === 'N/A' ? '✅' : '⚠️';

            let fileTable = '';
            if (fileBreakdown.length > 0) {
              fileTable = '\n### 📄 Impacted Files Breakdown\n\n' +
                '| File | New Code Coverage | Lines |\n' +
                '| :--- | :--- | :--- |\n' +
                fileBreakdown.map(f => `| \`${f.file}\` | ${f.coverage} | ${f.lines} |`).join('\n');
            }

            const body = `${header}

            | Metric | Value | Status |
            | :--- | :--- | :--- |
            | **Total Coverage** | ${totalCoverage} | ${totalStatus} |
            | **New Code Coverage** | ${newCodeCoverage} (${newCodeStats.covered}/${newCodeStats.total} stmts) | ${newStatus} |
            ${fileTable}

            > [!TIP]
            > This project maintains a minimum coverage threshold of **85%**. Maintain or improve coverage on new code to ensure long-term stability.

            ---
            *Last updated: ${new Date().toUTCString()}*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const botComment = comments.find(c => c.body.startsWith(header));

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: body
              });
            }

